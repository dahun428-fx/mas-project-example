<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>mini_mas</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 0 16px;
            line-height: 1.6;
        }

        #row {
            display: flex;
            gap: 8px;
        }

        #q {
            flex: 1;
            padding: 10px;
            font-size: 15px;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
        }

        #progress {
            margin: 20px 0;
            font-size: 13px;
            color: #555;
        }

        #progress div {
            padding: 2px 0;
        }

        #answer {
            white-space: pre-wrap;
            border-top: 1px solid #ddd;
            padding-top: 16px;
            min-height: 60px;
        }

        .err {
            color: #b00;
        }
    </style>
</head>

<body>
    <h1>mini_mas</h1>
    <div id="row">
        <input id="q" value="내 LDL 높은데 뭘 먹어야 돼?" />
        <button id="send">보내기</button>
    </div>
    <div id="progress"></div>
    <div id="answer"></div>

    <script>
        const $q = document.getElementById("q");
        const $send = document.getElementById("send");
        const $progress = document.getElementById("progress");
        const $answer = document.getElementById("answer");

        function log(text, cls) {
            const div = document.createElement("div");
            div.textContent = text;
            if (cls) div.className = cls;
            $progress.appendChild(div);
        }

        function handle(name, data) {
            if (name === "progress") log(`· ${data.label} (${data.elapsed_ms}ms)`);
            else if (name === "agents") log(`· 담당: ${data.agents.join(", ")} — ${data.reason}`);
            else if (name === "agent_done") log(data.ok ? `· ${data.agent} 완료 (${data.elapsed_ms}ms)` : `· ${data.agent} 실패: ${data.error}`, data.ok ? "" : "err");
            else if (name === "result") $answer.textContent = data.text;
            else if (name === "status") log(`· 끝 (${data.code}, ${data.total_ms}ms)`);
        }

        async function send() {
            $progress.textContent = "";
            $answer.textContent = "";
            $send.disabled = true;

            const resp = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: $q.value }),
            });

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                let sep;
                while ((sep = buffer.indexOf("\n\n")) !== -1) {
                    const block = buffer.slice(0, sep);
                    buffer = buffer.slice(sep + 2);
                    const name = block.match(/^event: (.+)$/m)?.[1];
                    const raw = block.match(/^data: (.+)$/m)?.[1];
                    if (name && raw) handle(name, JSON.parse(raw));
                }
            }
            $send.disabled = false;
        }

        $send.onclick = send;
        $q.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    </script>
</body>

</html>
